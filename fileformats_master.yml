---
'!image (raster)':
  name: Image files
  access:
    tool: image
    output: jpg
  statutory:
    tool: image
    output: tiff
'!image (vector)':
  name: Svg files
  access:
    tool: copy
    output: copy
  statutory:
    tool: html
    output: tiff
'!page description':
  name: PDF files
  access:
    tool: copy
    output: copy
  statutory:
    tool: pdf
    output: tiff
'!word processor':
  name: odt
  access:
    tool: document
    output: pdf
  statutory:
    tool: document
    output: tiff
'!spreadsheet':
  name: Open Document Spreadsheet
  access:
    tool: document
    output: html
  statutory:
    tool: document
    output: tiff
'!audio':
  name: .mp3 files
  access:
    tool: copy
    output: copy
  statutory:
    tool: copy
    output: copy
'!video':
  access:
    tool: video
    output: h264
  statutory:
    tool: video
    output: h264-mpg
'!dataset':
  access:
    tool: document
    output: html
  statutory:
    tool: document
    output: tiff
'!email':
  access:
    tool: msg
    output: html
  statutory:
    tool: msg
    via:
      - - html
        - pdf
    output: tiff
'!gis':
  access:
    tool: copy
    output: copy  # GeoJson - one day :)
  statutory:
    tool: copy
    output: copy
'!model':
  access:
    tool: cad
    output: svg
  statutory:
    tool: cad
    output: tiff
'!presentation':
  access:
    tool: document
    output: pdf
  statutory:
    tool: document
    output: tiff
'!text (mark-up)':
  access:
    tool: copy
    output: copy
  statutory:
    tool: text
    output: tiff
'!text (structured)':
  access:
    tool: copy
    output: copy
  statutory:
    tool: text
    output: tiff
'!text (unstructured)':
  access:
    tool: copy
    output: copy
  statutory:
    tool: text
    output: tiff
'!ext=.flac':
  access:
    tool: audio
    output: mp3
  statutory:
    tool: audio
    output: wav

# Global puids
fmt/3:
  name: animated gif
  access:
    tool: copy
    output: copy
  statutory:
    tool: video
    output: h264-mpg
fmt/96:
  name: Hypertext Markup Language
  access:
    tool: copy
    output: copy
  statutory:
    tool: html
    output: tiff
fmt/98:
  name: Hypertext Markup Language
  access:
    tool: copy
    output: copy
  statutory:
    tool: html
    output: tiff
fmt/99:
  name: Hypertext Markup Language
  access:
    tool: copy
    output: copy
  statutory:
    tool: html
    output: tiff
fmt/100:
  name: Hypertext Markup Language
  access:
    tool: copy
    output: copy
  statutory:
    tool: html
    output: tiff
fmt/353:
  name: Tagged Image File Format (tif)
  access:
    tool: image
    output: pdf
  statutory:
    tool: image
    output: tiff
fmt/950:
  name: MIME Email 1.0
  access:
    tool: eml
    output: html
  statutory:
    tool: eml
    via:
      - - eml
        - html
    output: tiff
x-fmt/111:
  name: Plain Text File
  access:
    tool: copy
    output: copy
  statutory:
    tool: text
    output: tiff

# Custom puids
aca-fmt/29:
  # should just be copied to statutory along the .gml file
  name: XML Schema Definition (Aarhus Stadsarkivs custom XSD)
  access:
    tool: copy
    output: copy
  statutory:
    tool: copy
    output: copy
